project:
  title:        "Qwen INT4 Systolic PE Array Demo"
  author:       "Alexander Manko"
  discord:      ""
  description:  "Demo weight-stationary systolic array (4x8, INT4 weights x INT8 activations) - prototype compute core for a pipeline of inference chips targeting Qwen3"
  language:     "Verilog"
  clock_hz:     10000000

  top_module:  "tt_um_qwen_pe_array"

  source_files:
    - "pe_int4x8.v"
    - "systolic_array.v"
    - "tt_um_qwen_pe_array.v"

  tiles: "2x1"

pinout:
  ui[0]: "mode/data bit0"
  ui[1]: "mode/data bit1"
  ui[2]: "data bit2"
  ui[3]: "data bit3 / weight int4 lsb"
  ui[4]: "data bit4 / col_addr0"
  ui[5]: "data bit5 / col_addr1"
  ui[6]: "mode_select bit0"
  ui[7]: "mode_select bit1"
  uo[0]: "result byte bit0"
  uo[1]: "result byte bit1"
  uo[2]: "result byte bit2"
  uo[3]: "result byte bit3"
  uo[4]: "result byte bit4"
  uo[5]: "result byte bit5"
  uo[6]: "result byte bit6"
  uo[7]: "result byte bit7"
  uio[0]: "result_valid flag"
  uio[1]: "unused"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "row_addr bit0"
  uio[5]: "row_addr bit1"
  uio[6]: "row_addr bit2"
  uio[7]: "row_addr bit3"
